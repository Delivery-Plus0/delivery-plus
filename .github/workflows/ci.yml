name: CI

on:
  pull_request:
  push:
    branches: [main , testing , dev]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@food-delivery/shared
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --build-arg SERVICE_NAME=api-gateway -t food-delivery-api-gateway:ci .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - run: docker build --build-arg SERVICE_NAME=api-gateway -t food-delivery-api-gateway:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: food-delivery-api-gateway:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
