name: CI

on:
  pull_request:
  push:
    branches: [main , testing , dev]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@food-delivery/shared
      - run: npm run lint
      - run: npm test
        env:
          # Opts the shared durable-idempotency spec into also running against
          # this real Redis, which exercises its Lua scripts. Without it the
          # spec runs against its in-memory fake only (as in pr-quality.yml).
          REDIS_TEST_URL: redis://localhost:6379
      - run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      # The root stack runs with NODE_ENV=production and requires SYSTEM_JWT_SECRET (#202); placeholder for config only.
      - run: docker compose config --quiet
        env:
          SYSTEM_JWT_SECRET: compose_validation_only_system_jwt_4b7e1c
      - run: docker build --build-arg SERVICE_NAME=api-gateway -t food-delivery-api-gateway:ci .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - run: docker build --build-arg SERVICE_NAME=api-gateway -t food-delivery-api-gateway:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: food-delivery-api-gateway:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
