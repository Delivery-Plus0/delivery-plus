      DATABASE_URL: postgres://${POSTGRES_USER_URLENCODED:?POSTGRES_USER_URLENCODED must be set}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/delivery_service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KAFKA_BROKER: kafka:29092
      ORDER_SERVICE_URL: http://order-service:3006
      DRIVER_SERVICE_URL: http://driver-service:3009
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3008/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  driver-service:
