      DATABASE_URL: postgres://${POSTGRES_USER_URLENCODED:?POSTGRES_USER_URLENCODED must be set}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/driver_service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KAFKA_BROKER: kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3009/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      args:
        SERVICE_NAME: tracking-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DELIVERY_SERVICE_URL: http://delivery-service:3008
      DRIVER_SERVICE_URL: http://driver-service:3009
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3010/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER_URLENCODED:?POSTGRES_USER_URLENCODED must be set}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/notification_service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3011/health']
