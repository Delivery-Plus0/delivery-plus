services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_test_data:/data

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    command: >-
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready local; do sleep 1; done;
      mc mb --ignore-existing "local/$$AWS_S3_BUCKET";
      mc anonymous set download "local/$$AWS_S3_BUCKET";
      mc ilm rule add "local/$$AWS_S3_BUCKET" --prefix pending/ --expire-days 1
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-delivery-plus-media}

  postgres:
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  redis:
    ports:
      - '6379:6379'

  kafka:
    ports:
      - '9092:9092'

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: test
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      RESTAURANT_SERVICE_URL: http://restaurant-service:3003
      MENU_SERVICE_URL: http://menu-service:3004
      CART_SERVICE_URL: http://cart-service:3005
      ORDER_SERVICE_URL: http://order-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      DELIVERY_SERVICE_URL: http://delivery-service:3008
      DRIVER_SERVICE_URL: http://driver-service:3009
      TRACKING_SERVICE_URL: http://tracking-service:3010
      NOTIFICATION_SERVICE_URL: http://notification-service:3011
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_service
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-local-internal-auth-development-only}
      USER_SERVICE_URL: http://user-service:3002
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      args:
        SERVICE_NAME: user-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_service
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      REDIS_URL: redis://redis:6379
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-local-internal-auth-development-only}
      ORDER_SERVICE_URL: http://order-service:3006
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-delivery-plus-media}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_PUBLIC_BASE_URL: ${AWS_PUBLIC_BASE_URL:-http://localhost:9000/delivery-plus-media}
      AWS_S3_FORCE_PATH_STYLE: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  restaurant-service:
    build:
      context: .
      args:
        SERVICE_NAME: restaurant-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/restaurant_service
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-delivery-plus-media}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_PUBLIC_BASE_URL: ${AWS_PUBLIC_BASE_URL:-http://localhost:9000/delivery-plus-media}
      AWS_S3_FORCE_PATH_STYLE: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3003/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  menu-service:
    build:
      context: .
      args:
        SERVICE_NAME: menu-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/menu_service
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      RESTAURANT_SERVICE_URL: http://restaurant-service:3003
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-delivery-plus-media}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_PUBLIC_BASE_URL: ${AWS_PUBLIC_BASE_URL:-http://localhost:9000/delivery-plus-media}
      AWS_S3_FORCE_PATH_STYLE: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3004/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  cart-service:
    build:
      context: .
      args:
        SERVICE_NAME: cart-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      MENU_SERVICE_URL: http://menu-service:3004
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3005/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      menu-service:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/order_service
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      KAFKA_BROKER: kafka:29092
      CART_SERVICE_URL: http://cart-service:3005
      RESTAURANT_SERVICE_URL: http://restaurant-service:3003
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3006/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE_NAME: payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_service
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      KAFKA_BROKER: kafka:29092
      ORDER_SERVICE_URL: http://order-service:3006
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3007/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      args:
        SERVICE_NAME: delivery-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery_service
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      KAFKA_BROKER: kafka:29092
      ORDER_SERVICE_URL: http://order-service:3006
      DRIVER_SERVICE_URL: http://driver-service:3009
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3008/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  driver-service:
    build:
      context: .
      args:
        SERVICE_NAME: driver-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/driver_service
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      KAFKA_BROKER: kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3009/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      args:
        SERVICE_NAME: tracking-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      DELIVERY_SERVICE_URL: http://delivery-service:3008
      DRIVER_SERVICE_URL: http://driver-service:3009
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3010/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification_service
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      KAFKA_BROKER: kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3011/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  minio_test_data:
