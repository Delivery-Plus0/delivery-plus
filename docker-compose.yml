# NOTE: This file spins up shared infra (Postgres, Redis, Kafka) plus all
# application services. Every app service exposes a GET /health endpoint used
# for its healthcheck, and depends_on uses `condition: service_healthy` so the
# stack comes up in a deterministic order instead of "by luck".

services:
  # Shared infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence: carts, and the processed-event markers that stop Kafka redeliveries
    # from being handled twice, survive a Redis restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD-SHELL', 'echo srvr | nc localhost 2181 | grep -q "Zookeeper version"']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8085:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Application services
  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
      - MENU_SERVICE_URL=http://menu-service:3004
      - CART_SERVICE_URL=http://cart-service:3005
      - ORDER_SERVICE_URL=http://order-service:3006
      - PAYMENT_SERVICE_URL=http://payment-service:3007
      - DELIVERY_SERVICE_URL=http://delivery-service:3008
      - DRIVER_SERVICE_URL=http://driver-service:3009
      - TRACKING_SERVICE_URL=http://tracking-service:3010
      - NOTIFICATION_SERVICE_URL=http://notification-service:3011
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_service
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-internal-auth-development-only}
      - USER_SERVICE_URL=http://user-service:3002
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      args:
        SERVICE_NAME: user-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_service
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-internal-auth-development-only}
      - ORDER_SERVICE_URL=http://order-service:3006
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  restaurant-service:
    build:
      context: .
      args:
        SERVICE_NAME: restaurant-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/restaurant_service
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3003/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  menu-service:
    build:
      context: .
      args:
        SERVICE_NAME: menu-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/menu_service
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3004/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy

  cart-service:
    build:
      context: .
      args:
        SERVICE_NAME: cart-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - MENU_SERVICE_URL=http://menu-service:3004
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3005/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      menu-service:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/order_service
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - KAFKA_BROKER=kafka:29092
      - CART_SERVICE_URL=http://cart-service:3005
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
      - USER_SERVICE_URL=http://user-service:3002
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3006/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE_NAME: payment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_service
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - KAFKA_BROKER=kafka:29092
      - ORDER_SERVICE_URL=http://order-service:3006
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3007/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      args:
        SERVICE_NAME: delivery-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery_service
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - KAFKA_BROKER=kafka:29092
      - ORDER_SERVICE_URL=http://order-service:3006
      - DRIVER_SERVICE_URL=http://driver-service:3009
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3008/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  driver-service:
    build:
      context: .
      args:
        SERVICE_NAME: driver-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/driver_service
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - KAFKA_BROKER=kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3009/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      args:
        SERVICE_NAME: tracking-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - DELIVERY_SERVICE_URL=http://delivery-service:3008
      - DRIVER_SERVICE_URL=http://driver-service:3009
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3010/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification_service
      - JWT_SECRET=${JWT_SECRET:-local-development-only}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:29092
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3011/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  redis_data: